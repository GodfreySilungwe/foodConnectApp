services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodconnect-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodconnect-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_IDENTITY_API_URL: http://localhost:3002
      NEXT_PUBLIC_PROVIDER_API_URL: http://localhost:3003
      NEXT_PUBLIC_ORDER_API_URL: http://localhost:3004
    depends_on:
      backend:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      provider-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: foodconnect-identity
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  provider-service:
    build:
      context: ./services/provider-service
      dockerfile: Dockerfile
    container_name: foodconnect-provider
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: foodconnect-order
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NODE_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
