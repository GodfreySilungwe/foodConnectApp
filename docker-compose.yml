services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: foodconnect-dynamodb
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data -disableTelemetry"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/shell/ || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodconnect-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodconnect-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_IDENTITY_API_URL: http://localhost:3002
      NEXT_PUBLIC_PROVIDER_API_URL: http://localhost:3003
      NEXT_PUBLIC_ORDER_API_URL: http://localhost:3004
    depends_on:
      backend:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      provider-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: foodconnect-identity
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      USE_DYNAMODB: "true"
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: fakeMyKeyId
      AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
      USERS_TABLE: foodconnect-dev-users
      JWT_SECRET: foodconnect-development-secret
    depends_on:
      dynamodb-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  provider-service:
    build:
      context: ./services/provider-service
      dockerfile: Dockerfile
    container_name: foodconnect-provider
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
      USE_DYNAMODB: "true"
      JWT_SECRET: foodconnect-development-secret
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: fakeMyKeyId
      AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
      PROVIDERS_TABLE: foodconnect-dev-providers
      MENUS_TABLE: foodconnect-dev-menus
    depends_on:
      dynamodb-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: foodconnect-order
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NODE_ENV: development
      USE_DYNAMODB: "true"
      JWT_SECRET: foodconnect-development-secret
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: fakeMyKeyId
      AWS_SECRET_ACCESS_KEY: fakeSecretAccessKey
      ORDERS_TABLE: foodconnect-dev-orders
    depends_on:
      dynamodb-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  dynamodb-data:
